
# WireTitan Phase 2 - Primary Nginx Configuration

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /opt/homebrew/var/cache/nginx
        levels=1:2
        keys_zone=wiretitan_cache:10m
        max_size=100m
        inactive=60m
        use_temp_path=off;

    upstream backends {
        server 10.7.10.202:3001;
        server 127.0.0.1:3002;
    }

    server {
        listen 8443 ssl;
        server_name app.wiretitan.test;

        ssl_certificate /opt/homebrew/etc/nginx/certs/app.wiretitan.test.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.wiretitan.test.key;

        location / {
            proxy_pass http://backends;

            proxy_cache wiretitan_cache;
            proxy_cache_valid 200 60s;

            add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
