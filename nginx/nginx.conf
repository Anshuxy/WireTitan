worker_processes 1;

events {
    worker_connections 1024;
}

http {

    upstream backends {
        server 10.7.6.126:3001;
        server 127.0.0.1:3002;
    }

    server {
        listen 8080;
        server_name app.team1.test;

        location / {
            proxy_pass http://backends;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
