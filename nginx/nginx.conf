# ==========================================
# WireTitan – nginx Configuration (Phase 1 Reference)
# NOTE: This is the original Phase 1 reference configuration,
# preserved for historical context.
# Phase 2 configurations are in nginx/phase-2/
# ==========================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {

    upstream backends {
        # Backend A on Mac 1
        server 10.7.10.202:3001;
        # Backend B on Mac 2 (local)
        server 127.0.0.1:3002;
    }

    server {
        listen 8443 ssl;
        server_name app.wiretitan.test;

        # Certificate path placeholders – replace with the actual certificate
        # and private key locations on the edge Mac running this config.
        ssl_certificate     <PATH_TO_CERTS>/app.wiretitan.test.crt;
        ssl_certificate_key <PATH_TO_CERTS>/app.wiretitan.test.key;

        location / {
            proxy_pass http://backends;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
