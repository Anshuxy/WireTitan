
# WireTitan Phase 2 - Standby Nginx Configuration

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8443 ssl;
        server_name app.wiretitan.test;

        ssl_certificate /opt/homebrew/etc/nginx/certs/app.wiretitan.test.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.wiretitan.test.key;

        location / {
            proxy_pass https://10.7.10.202:8443;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
