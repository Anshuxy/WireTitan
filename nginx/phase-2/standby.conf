# ==========================================
# WireTitan – Standby Nginx Configuration
# Host: Mac 1 (Farhana) – 10.7.10.202
# HTTPS port: 8443
# ==========================================
#
# IMPORTANT LIMITATION:
# This standby nginx is an ALTERNATIVE ENTRY POINT only.
# It proxies all traffic upstream to the PRIMARY nginx on Mac 2
# at https://10.7.3.20:8443.
#
# Therefore, if the primary nginx (Mac 2) is unavailable, this
# standby edge CANNOT serve requests independently. It is NOT a
# fully independent failover edge. This limitation is documented
# in the Phase 2 report.
#
# During Extension E, the DNS A record for app.wiretitan.test was
# temporarily changed to 10.7.10.202, routing clients through this
# standby nginx. The standby successfully returned HTTP 200 responses
# by forwarding to the primary nginx.
#
# Certificate paths – use clearly labelled placeholders below and replace
# with the actual certificate and private key locations on Mac 1.
# Never commit the private key (.key file) to the repository.
# ==========================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 8443 ssl;
        server_name app.wiretitan.test;

        # Placeholder certificate paths – replace with Mac 1 certificate locations
        ssl_certificate     <PATH_TO_CERTS>/app.wiretitan.test.crt;
        ssl_certificate_key <PATH_TO_CERTS>/app.wiretitan.test.key;

        location / {
            # Forward to primary nginx on Mac 2
            proxy_pass https://10.7.3.20:8443;

            # Skip SSL verification for the upstream connection
            # (acceptable for a local private network test environment)
            proxy_ssl_verify off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
