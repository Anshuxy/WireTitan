# ==========================================
# WireTitan – Primary Nginx Configuration
# Host: Mac 2 (Anshu) – 10.7.3.20
# HTTPS port: 8443
# ==========================================
#
# This is the PRIMARY edge, running on Mac 2.
# It distributes traffic in round-robin between:
#   – Backend A on Mac 1 at 10.7.10.202:3001
#   – Backend B locally at 127.0.0.1:3002
#
# IMPORTANT: Certificate paths below are from the actual Mac 2
# deployment using Homebrew. Adjust if paths differ on your machine.
# Never commit the private key (.key file) to the repository.
# ==========================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # HTTP cache zone (Extension B caching evidence)
    proxy_cache_path /opt/homebrew/var/cache/nginx
        levels=1:2
        keys_zone=wiretitan_cache:10m
        max_size=100m
        inactive=60m
        use_temp_path=off;

    # Round-robin upstream (Extension D load balancing and failover)
    upstream backends {
        server 10.7.10.202:3001;   # Backend A – Mac 1 (Farhana)
        server 127.0.0.1:3002;     # Backend B – Mac 2 local
    }

    server {
        listen 8443 ssl;
        server_name app.wiretitan.test;

        # Certificate paths – Mac 2 Homebrew nginx certificate location
        ssl_certificate     /opt/homebrew/etc/nginx/certs/app.wiretitan.test.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.wiretitan.test.key;

        location / {
            proxy_pass http://backends;

            # Caching
            proxy_cache wiretitan_cache;
            proxy_cache_valid 200 60s;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
