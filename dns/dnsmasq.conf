# ==========================================
# WireTitan - dnsmasq DNS Configuration
# Host: Mac 1 (Farhana) – 10.7.10.202
# ==========================================

# Listen on DNS port 53
port=53

# Bind to Mac 1's LAN address and loopback only
listen-address=127.0.0.1,10.7.10.202
bind-interfaces

# ==========================================
# Application DNS Records
# Final state: both names point to Mac 2 (primary edge)
# During Extension E edge-migration test, app.wiretitan.test
# was temporarily changed to 10.7.10.202 (Mac 1 standby edge).
# ==========================================
address=/app.wiretitan.test/10.7.3.20
address=/api.wiretitan.test/10.7.3.20

# DNS TTL – 30 seconds (Extension B)
local-ttl=30

# Upstream resolvers for non-local names
server=8.8.8.8
server=1.1.1.1

# Logging
log-queries
log-facility=/tmp/dnsmasq.log
