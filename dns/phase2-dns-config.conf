# ==========================================
# WireTitan – Phase 2 DNS Configuration
# DNS Service: dnsmasq on Mac 1 (10.7.10.202)
# ==========================================

# Application DNS records
# Final state points to Mac 2 primary edge
address=/app.wiretitan.test/10.7.3.20
address=/api.wiretitan.test/10.7.3.20

# During Extension E controlled edge migration test, the record was
# temporarily changed to 10.7.10.202 (Mac 1 standby edge):
#   address=/app.wiretitan.test/10.7.10.202

# DNS record TTL – 30 seconds (Extension B)
local-ttl=30

# Listen on Mac 1's LAN address
listen-address=127.0.0.1,10.7.10.202
bind-interfaces

# Upstream resolvers
server=8.8.8.8
server=1.1.1.1
